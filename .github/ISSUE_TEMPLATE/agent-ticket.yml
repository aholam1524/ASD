name: Agent ticket
description: Ticket for the Dev / Test / Review factory
title: ""
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: What should happen
      description: Describe the change. The Dev agent treats this as the spec.
      placeholder: Add a one-line Status note to the README.
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Done when
      description: Concrete checks the Test and Review agents can use.
      placeholder: |
        - README.md has a Status line
        - The line says this is v0
    validations:
      required: true
  - type: markdown
    attributes:
      value: Submitting this issue starts the Dev agent. It will open a PR into `dev`. You merge that PR. Do not add `agent-dev` unless a launch failed and you need a retry.
