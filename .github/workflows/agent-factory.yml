name: Agent factory

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

concurrency:
  group: agent-factory-${{ github.event.issue.number || github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: false

permissions:
  issues: write
  pull-requests: write
  contents: read

jobs:
  dispatch:
    if: >
      github.event.label.name == 'agent-dev' ||
      github.event.label.name == 'agent-test' ||
      github.event.label.name == 'agent-review'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dispatcher
        run: pip install -r requirements.txt
      - name: Launch cloud agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python factory/dispatch.py
