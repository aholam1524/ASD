name: Factory CI

on:
  pull_request:
    branches: [dev, test, main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run factory CI
        run: bash factory/run_ci.sh
